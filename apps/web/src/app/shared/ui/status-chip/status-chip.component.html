<span
  class="inline-flex min-h-7 items-center gap-1.5 rounded-md border px-2 py-1 text-xs font-semibold {{
    treatment.chipClass
  }}"
  [attr.aria-label]="displayLabel + ': ' + treatment.description"
>
  <span
    class="inline-flex h-4 min-w-4 items-center justify-center rounded-sm border border-current px-0.5 text-[0.625rem] leading-none"
    aria-hidden="true"
  >
    {{ treatment.cue }}
  </span>
  <span>{{ displayLabel }}</span>
</span>
