<span
  class="inline-flex max-w-full flex-wrap items-center gap-x-1 gap-y-0.5 text-xs font-semibold uppercase leading-4 tracking-normal"
  [attr.aria-label]="displayLabel + ': ' + treatment.description"
>
  <span
    class="inline-flex h-5 min-w-5 items-center justify-center rounded-sm border px-1 text-[0.625rem] leading-none {{
      treatment.markerClass
    }}"
    aria-hidden="true"
  >
    {{ treatment.cue }}
  </span>
  <span class="min-w-0 whitespace-normal break-words">{{ displayLabel }}</span>
</span>
