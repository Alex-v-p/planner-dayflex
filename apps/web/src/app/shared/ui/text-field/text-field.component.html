<label [for]="fieldId" class="block text-sm font-medium text-ink-950">
  {{ label }}
</label>
<input
  [id]="fieldId"
  [value]="value"
  [placeholder]="placeholder"
  [disabled]="disabled"
  [required]="required"
  [attr.aria-describedby]="helperText ? helperId : null"
  class="mt-2 min-h-11 w-full rounded-md border border-mist-200 bg-white px-3 py-2 text-base text-ink-950 shadow-sm transition placeholder:text-ink-600/70 focus:border-meadow-600 focus:outline-none focus:ring-2 focus:ring-meadow-600/30 disabled:cursor-not-allowed disabled:bg-mist-100"
/>
@if (helperText) {
  <p [id]="helperId" class="mt-2 text-sm leading-6 text-ink-600">
    {{ helperText }}
  </p>
}
