<section class="grid gap-6 lg:grid-cols-[minmax(0,1fr)_24rem]">
  <div class="py-2">
    <h1 class="text-3xl font-semibold tracking-normal text-ink-950">
      Planner Dayflex
    </h1>
    <p class="mt-3 max-w-2xl text-base leading-7 text-ink-600">
      A quiet daily workspace is taking shape here. The next screens will keep
      recovery practical when plans shift.
    </p>

    <div class="mt-8 grid gap-4 sm:grid-cols-2">
      <pdf-feedback-message
        title="Getting things ready"
        message="Your day space can hold steady while information loads."
        state="loading"
      />
      <pdf-feedback-message
        title="Something needs attention"
        message="A retry-safe message can appear without losing your place."
        state="error"
      />
    </div>
  </div>

  <aside
    aria-labelledby="baseline-controls-title"
    class="rounded-lg border border-mist-200 bg-white p-6 shadow-sm"
  >
    <h2
      id="baseline-controls-title"
      class="text-base font-semibold tracking-normal text-ink-950"
    >
      Reusable controls
    </h2>

    <div class="mt-5 grid gap-5">
      <pdf-text-field
        label="Day note"
        helperText="Short labels and steady focus states are ready."
        placeholder="A small change to remember"
        [value]="exampleValue"
      />
      <pdf-action-button label="Continue" />
    </div>
  </aside>
</section>
