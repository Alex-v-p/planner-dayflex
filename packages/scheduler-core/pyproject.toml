[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "planner-dayflex-scheduler-core"
version = "0.1.0"
description = "Pure deterministic scheduling core for planner-dayflex"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "tzdata>=2025.2,<2027",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
