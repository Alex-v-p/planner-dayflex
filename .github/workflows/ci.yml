name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Confirm repository scaffold
        run: |
          test -f AGENTS.md
          test -f docs/product/vision.md
          test -f docs/architecture/overview.md
          test -f .codex/config.toml

      # Add format, lint, test, and build commands here after selecting the stack.
